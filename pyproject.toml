[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "humaninput"
version = "0.1.0"
description = "Statistical model of human input timing (keystrokes, mouse) emitted as a timed event stream"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "humaninput contributors" }]
keywords = ["typing", "simulation", "mouse", "keystroke-dynamics", "demo-recording", "automation"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Software Development :: Testing",
    "Topic :: Multimedia :: Graphics :: Presentation",
]
dependencies = [
    "numpy>=1.24",
    "tomli>=2.0; python_version < '3.11'",
]

[project.optional-dependencies]
pynput = ["pynput>=1.7"]
matplotlib = ["matplotlib>=3.7"]
noise = ["noise>=1.2.2"]
test = ["pytest>=7.4", "scipy>=1.10"]
dev = ["pytest>=7.4", "scipy>=1.10", "matplotlib>=3.7", "ruff>=0.5"]

[project.scripts]
humaninput = "humaninput.cli:main"

[project.urls]
Homepage = "https://github.com/humaninput/humaninput"
Repository = "https://github.com/humaninput/humaninput"
Issues = "https://github.com/humaninput/humaninput/issues"

[tool.hatch.build.targets.wheel]
packages = ["humaninput"]

[tool.hatch.build.targets.wheel.force-include]
"humaninput/profiles" = "humaninput/profiles"
"humaninput/layouts" = "humaninput/layouts"

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-p no:pytest_playwright"

[tool.ruff]
target-version = "py310"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP"]
ignore = ["E501"]
