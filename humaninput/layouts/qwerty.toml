# US QWERTY layout table.
#
# Each entry maps a character to its physical key: which row it sits on,
# its horizontal position (col, accounting for physical row stagger, used
# for adjacency distance when picking substitution-error targets), which
# hand types it, and which finger. This table is the sole input to
# digraph classification (typing/model.py) and to substitution-error
# neighbor lookup (typing/errors.py).
#
# row: 0 = number row, 1 = top row, 2 = home row, 3 = bottom row
# hand: "left" | "right"
# finger: "pinky" | "ring" | "middle" | "index" | "thumb"
# shift: true if this character requires the Shift modifier
# base: for shifted characters, the unshifted character on the same physical key

name = "qwerty"
display_name = "US QWERTY"

[keys."`"]
row = 0
col = 0.0
hand = "left"
finger = "pinky"

[keys."~"]
row = 0
col = 0.0
hand = "left"
finger = "pinky"
shift = true
base = "`"

