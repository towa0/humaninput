name = "fast_coder"
wpm_target = 100
layout = "qwerty"

[interval]
distribution = "lognormal"
mu_ms = 107
sigma = 0.38

[digraph_multipliers]
same_key = 0.55
alternating_hand = 0.80
same_hand_different_finger = 1.0
same_finger_different_key = 1.55
to_punctuation = 1.9
from_punctuation = 1.6
to_digit = 1.8

[hold]
mu_ms = 75
sigma = 0.28

[rollover]
probability = 0.45
overlap_ms_mu = 26

[burst]
mean_length = 8.5
pause_ms_mu = 180
pause_ms_sigma = 0.45

[cognitive_pauses]
rare_word_probability = 0.20
digit_probability = 0.35
bracket_probability = 0.40
sentence_start_probability = 0.25
pause_ms_min = 300
pause_ms_max = 1100

[fatigue]
enabled = false

[errors]
substitution_rate = 0.012
transposition_rate = 0.007
insertion_rate = 0.005
omission_rate = 0.004
detection_delay_chars = [1, 2]
detection_delay_word_probability = 0.05
correction_strategy = "immediate"
uncorrected_rate = 0.02
backspace_speed_multiplier = 0.65
notice_pause_ms_min = 100
notice_pause_ms_max = 320

[mouse]
fitts_a_ms = 40
fitts_b_ms = 130
tremor_amplitude_px = 0.4
