name = "mobile_thumbs"
wpm_target = 38
layout = "qwerty"

[interval]
distribution = "lognormal"
mu_ms = 260
sigma = 0.60

[digraph_multipliers]
# thumb typing on a compressed on-screen keyboard: physical hand/finger
# classification from a full-size layout is a weak signal, so keep the
# spread narrow.
same_key = 0.80
alternating_hand = 0.95
same_hand_different_finger = 1.0
same_finger_different_key = 1.10
to_punctuation = 1.5
from_punctuation = 1.3
to_digit = 1.7

[hold]
mu_ms = 95
sigma = 0.40

[rollover]
probability = 0.10
overlap_ms_mu = 12

[burst]
mean_length = 5.0
pause_ms_mu = 200
pause_ms_sigma = 0.55

[cognitive_pauses]
rare_word_probability = 0.30
digit_probability = 0.40
bracket_probability = 0.35
sentence_start_probability = 0.30
pause_ms_min = 300
pause_ms_max = 1200
comma_probability = 0.22
comma_pause_ms_min = 120
comma_pause_ms_max = 400

[fatigue]
enabled = false

[pace]
enabled = true
reversion_rate = 0.02
volatility = 0.08
min_multiplier = 0.65
max_multiplier = 1.6

[errors]
substitution_rate = 0.035
transposition_rate = 0.006
insertion_rate = 0.010
omission_rate = 0.006
detection_delay_chars = [2, 5]
detection_delay_word_probability = 0.35
correction_strategy = "word"
uncorrected_rate = 0.03
backspace_speed_multiplier = 0.75
notice_pause_ms_min = 150
notice_pause_ms_max = 500
arrow_correction_probability = 0.05
arrow_correction_max_tail = 4
retype_error_rate_multiplier = 0.5
max_cascade_depth = 2

[mouse]
fitts_a_ms = 70
fitts_b_ms = 190
tremor_amplitude_px = 1.2
