name = "touch_typist"
wpm_target = 75
layout = "qwerty"

[interval]
distribution = "lognormal"
mu_ms = 128
sigma = 0.42

[digraph_multipliers]
same_key = 0.60
alternating_hand = 0.85
same_hand_different_finger = 1.0
same_finger_different_key = 1.60
to_punctuation = 1.30
from_punctuation = 1.30
to_digit = 2.0

[hold]
mu_ms = 88
sigma = 0.30

[rollover]
probability = 0.35
overlap_ms_mu = 22

[burst]
mean_length = 6.5
pause_ms_mu = 220
pause_ms_sigma = 0.5

[cognitive_pauses]
rare_word_probability = 0.30
digit_probability = 0.45
bracket_probability = 0.25
sentence_start_probability = 0.35
pause_ms_min = 400
pause_ms_max = 1400

[fatigue]
enabled = false

[errors]
substitution_rate = 0.008
transposition_rate = 0.004
insertion_rate = 0.002
omission_rate = 0.003
detection_delay_chars = [1, 3]
detection_delay_word_probability = 0.08
correction_strategy = "word"
uncorrected_rate = 0.05
backspace_speed_multiplier = 0.7
notice_pause_ms_min = 150
notice_pause_ms_max = 450

[mouse]
fitts_a_ms = 45
fitts_b_ms = 140
tremor_amplitude_px = 0.5
