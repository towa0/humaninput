name = "hunt_and_peck"
wpm_target = 30
layout = "qwerty"

[interval]
distribution = "lognormal"
mu_ms = 340
sigma = 0.55

[digraph_multipliers]
# hunt-and-peck typists don't use consistent fingers, so physical
# hand/finger relationships barely matter compared to touch typing.
same_key = 0.85
alternating_hand = 0.95
same_hand_different_finger = 1.0
same_finger_different_key = 1.05
to_punctuation = 1.6
from_punctuation = 1.3
to_digit = 2.4

[hold]
mu_ms = 110
sigma = 0.35

[rollover]
probability = 0.04
overlap_ms_mu = 10

[burst]
mean_length = 4.0
pause_ms_mu = 260
pause_ms_sigma = 0.5

[cognitive_pauses]
rare_word_probability = 0.55
digit_probability = 0.70
bracket_probability = 0.50
sentence_start_probability = 0.50
pause_ms_min = 350
pause_ms_max = 1800
comma_probability = 0.30
comma_pause_ms_min = 150
comma_pause_ms_max = 450

[fatigue]
enabled = false

[pace]
enabled = true
reversion_rate = 0.018
volatility = 0.07
min_multiplier = 0.7
max_multiplier = 1.5

[errors]
substitution_rate = 0.014
transposition_rate = 0.006
insertion_rate = 0.004
omission_rate = 0.006
detection_delay_chars = [1, 4]
detection_delay_word_probability = 0.12
correction_strategy = "immediate"
uncorrected_rate = 0.04
backspace_speed_multiplier = 0.8
notice_pause_ms_min = 200
notice_pause_ms_max = 600
arrow_correction_probability = 0.15
arrow_correction_max_tail = 6
retype_error_rate_multiplier = 0.5
max_cascade_depth = 2

[mouse]
fitts_a_ms = 60
fitts_b_ms = 170
tremor_amplitude_px = 0.9
